<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-yos360.png" />
    <link rel="apple-touch-icon" href="/icon-yos360.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <title>YOS360 — ERP UEMOA, Gestion Commerciale & Caisse POS</title>
    <meta property="og:image" content="/logo-yos360.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo-yos360.png" />

    <!-- Thème avant le premier affichage (mêmes règles que lib/prefs.tsx) ; intro courte après la première ouverture de l'onglet -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sm360_theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (sessionStorage.getItem('yos360_splash_seen')) document.documentElement.classList.add('yos-splash-quick');
          sessionStorage.setItem('yos360_splash_seen', '1');
        } catch (e) {}
      })();
    </script>

    <!-- Écran de chargement YOS360 : styles en ligne pour s'afficher dès la première image -->
    <style>
      .yos-loader {
        --yos-blue: #0270B8;
        --yos-green: #48B068;
        --yos-bg: #FBFCFB;
        --yos-track: #E6EBE8;
        --yos-muted: #6B7A72;
        --yos-ink: #1C2B24;
        --yos-chip-bg: rgba(255, 255, 255, .92);
        --yos-chip-border: #E1E8E3;
        --t: .7s; /* décalage de l'intro après l'arrivée des modules */
        --ease-out: cubic-bezier(.16, 1, .3, 1);
        --ease-in-out: cubic-bezier(.65, 0, .35, 1);
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: var(--yos-bg);
        font-family: Montserrat, system-ui, sans-serif;
        overflow: hidden;
        transition: opacity .7s var(--ease-in-out) .35s, visibility 0s linear 1.05s;
      }
      .dark .yos-loader { --yos-bg: #0B1410; --yos-track: #1E2B25; --yos-muted: #8FA197; --yos-blue: #2E95DB; --yos-ink: #E3EDE7; --yos-chip-bg: rgba(19, 34, 27, .92); --yos-chip-border: #24372D; }
      .yos-loader, .yos-loader * { box-sizing: border-box; }

      /* Halo coloré très doux derrière le logo */
      .yos-loader::before {
        content: ""; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
        background:
          radial-gradient(closest-side at 42% 45%, color-mix(in srgb, var(--yos-green) 18%, transparent), transparent 70%),
          radial-gradient(closest-side at 60% 58%, color-mix(in srgb, var(--yos-blue) 12%, transparent), transparent 70%);
        filter: blur(40px);
        opacity: 0; animation: yos-halo 1.6s var(--ease-out) .2s forwards, yos-halo-drift 9s var(--ease-in-out) 1.8s infinite alternate;
      }
      .yos-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 16px; }

      /* Logo */
      .yos-mark-wrap { --m: clamp(104px, 22vmin, 148px); position: relative; width: var(--m); }
      .yos-mark { display: block; width: 100%; height: auto; overflow: visible; }

      /* Les modules de l'ERP arrivent étiquetés, puis convergent pour former le cube */
      .yos-chip {
        position: absolute; left: 50%; top: 50%; z-index: 1;
        display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px;
        font-size: 11px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; color: var(--yos-ink);
        background: var(--yos-chip-bg); border: 1px solid var(--yos-chip-border);
        box-shadow: 0 8px 20px -10px rgba(16, 40, 28, .35);
        opacity: 0; animation: yos-chip 1.7s var(--ease-in-out) forwards;
      }
      .yos-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
      .yos-chip.c-tl { --cx: calc(var(--m) * -.98); --cy: calc(var(--m) * -.42); --dot: #48B068; animation-delay: 0s; }
      .yos-chip.c-tr { --cx: calc(var(--m) *  .98); --cy: calc(var(--m) * -.42); --dot: #117A35; animation-delay: .08s; }
      .yos-chip.c-bl { --cx: calc(var(--m) * -.98); --cy: calc(var(--m) *  .46); --dot: #117A35; animation-delay: .16s; }
      .yos-chip.c-br { --cx: calc(var(--m) *  .98); --cy: calc(var(--m) *  .46); --dot: #48B068; animation-delay: .24s; }

      .yos-mark .piece, .yos-mark .breathe { transform-box: view-box; transform-origin: 953px 1064px; }
      .yos-mark .piece { opacity: 0; animation: yos-enter 1.1s var(--ease-out) forwards; }
      .yos-mark .p-tl { --dx: -150px; --dy: -110px; --r: -14deg; animation-delay: .75s; }
      .yos-mark .p-tr { --dx:  150px; --dy: -110px; --r:  14deg; animation-delay: .83s; }
      .yos-mark .p-bl { --dx: -150px; --dy:  120px; --r:  14deg; animation-delay: .91s; }
      .yos-mark .p-br { --dx:  150px; --dy:  120px; --r: -14deg; animation-delay: .99s; }

      /* Respiration en boucle : le cube s'entrouvre puis se referme */
      .yos-mark .breathe { animation: yos-breathe 3.2s var(--ease-in-out) calc(var(--t) + 1.7s) infinite; }
      .yos-mark .p-tl .breathe { --bx: -16px; --by: -10px; }
      .yos-mark .p-tr .breathe { --bx:  16px; --by: -10px; }
      .yos-mark .p-bl .breathe { --bx: -16px; --by:  12px; }
      .yos-mark .p-br .breathe { --bx:  16px; --by:  12px; }

      /* Cœur lumineux (le losange central) */
      .yos-core { transform-box: fill-box; transform-origin: center; opacity: 0; animation: yos-core 1s var(--ease-out) calc(var(--t) + 1s) forwards, yos-core-pulse 3.2s var(--ease-in-out) calc(var(--t) + 1.7s) infinite; }
      .yos-ring { transform-box: fill-box; transform-origin: center; opacity: 0; fill: none; stroke: var(--yos-green); stroke-width: 6; animation: yos-ring 1.4s var(--ease-out) calc(var(--t) + 1.05s) forwards; }

      /* Reflet qui balaie le logo quand il est fermé */
      .yos-sheen { transform: translateX(-700px); animation: yos-sheen 3.2s var(--ease-in-out) calc(var(--t) + 1.7s) infinite; }

      /* Nom de marque */
      .yos-word { display: flex; flex-direction: column; align-items: center; line-height: 1; user-select: none; }
      .yos-title { font-weight: 800; font-size: clamp(34px, 7.5vmin, 48px); letter-spacing: -.02em; display: flex; }
      .yos-title span { display: inline-block; opacity: 0; transform: translateY(.55em); filter: blur(6px); animation: yos-letter .9s var(--ease-out) forwards; }
      .yos-title .b { color: var(--yos-blue); }
      .yos-title .g { color: var(--yos-green); }

      /* Signature en pied de page */
      .yos-by {
        position: absolute; left: 0; right: 0; bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
        text-align: center; font-weight: 800; font-size: 13px; color: var(--yos-blue); letter-spacing: .3em;
        opacity: 0; animation: yos-by 1.2s var(--ease-out) calc(var(--t) + 1.75s) forwards;
      }
      .yos-by span { font-weight: 500; letter-spacing: .08em; color: var(--yos-muted); margin-right: .35em; }

      /* Progression */
      .yos-progress { width: min(280px, 78vw); display: grid; gap: 10px; opacity: 0; animation: yos-fade .8s var(--ease-out) .4s forwards; }
      .yos-track { position: relative; width: 100%; height: 3px; border-radius: 3px; background: var(--yos-track); overflow: hidden; }
      .yos-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p, 0)); border-radius: inherit;
        background: linear-gradient(90deg, var(--yos-blue), var(--yos-green)); transition: transform .5s var(--ease-out); }
      .yos-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
        transform: translateX(-100%); animation: yos-shimmer 1.6s var(--ease-in-out) infinite; }
      .yos-status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; font-weight: 500; color: var(--yos-muted); }
      .yos-msg { transition: opacity .25s var(--ease-in-out), transform .25s var(--ease-in-out); }
      .yos-msg.is-swapping { opacity: 0; transform: translateY(4px); }
      .yos-pct { font-weight: 600; color: var(--yos-ink); font-variant-numeric: tabular-nums; }

      /* Intro courte quand l'onglet a déjà affiché l'écran (rechargement) */
      .yos-splash-quick .yos-loader { --t: -.7s; }
      .yos-splash-quick .yos-chip { display: none; }
      .yos-splash-quick .yos-mark .p-tl { animation-delay: 0s; }
      .yos-splash-quick .yos-mark .p-tr { animation-delay: .05s; }
      .yos-splash-quick .yos-mark .p-bl { animation-delay: .1s; }
      .yos-splash-quick .yos-mark .p-br { animation-delay: .15s; }

      /* Sortie : le cube s'ouvre et révèle l'application */
      .yos-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .yos-loader.is-done .breathe, .yos-loader.is-done .yos-sheen, .yos-loader.is-done .yos-core { animation-play-state: paused; }
      .yos-loader.is-done .piece { animation: yos-exit .9s var(--ease-in-out) forwards; }
      .yos-loader.is-done .p-tl, .yos-loader.is-done .p-tr { animation-delay: 0s; }
      .yos-loader.is-done .p-bl, .yos-loader.is-done .p-br { animation-delay: .05s; }
      .yos-loader.is-done .yos-word, .yos-loader.is-done .yos-progress, .yos-loader.is-done .yos-by { transition: opacity .45s var(--ease-in-out), transform .6s var(--ease-in-out); opacity: 0; transform: translateY(10px); }

      @keyframes yos-enter {
        from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.82); filter: blur(10px); }
        60%  { filter: blur(0); }
        to   { opacity: 1; transform: none; filter: blur(0); }
      }
      @keyframes yos-exit {
        from { opacity: 1; transform: none; }
        to   { opacity: 0; transform: translate(calc(var(--dx) * 2.4), calc(var(--dy) * 2.4)) rotate(calc(var(--r) * -1)) scale(1.25); }
      }
      @keyframes yos-breathe {
        0%, 12%, 46%, 100% { transform: none; }
        28%, 32%           { transform: translate(var(--bx), var(--by)); }
      }
      @keyframes yos-core { from { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.15); } to { opacity: 1; transform: scale(1); } }
      @keyframes yos-core-pulse { 0%, 12%, 46%, 100% { transform: scale(1); } 28%, 32% { transform: scale(1.35); } }
      @keyframes yos-ring { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(4.2); } }
      @keyframes yos-sheen { 0%, 50% { transform: translateX(-700px); } 85%, 100% { transform: translateX(1300px); } }
      @keyframes yos-letter { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes yos-by { from { opacity: 0; letter-spacing: .6em; } to { opacity: 1; letter-spacing: .3em; } }
      @keyframes yos-fade { to { opacity: 1; } }
      @keyframes yos-chip {
        0%   { opacity: 0; transform: translate(-50%, -50%) translate(var(--cx), var(--cy)) translateY(8px) scale(.92); }
        22%  { opacity: 1; transform: translate(-50%, -50%) translate(var(--cx), var(--cy)) scale(1); }
        62%  { opacity: 1; transform: translate(-50%, -50%) translate(var(--cx), var(--cy)) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) translate(calc(var(--cx) * .12), calc(var(--cy) * .12)) scale(.4); }
      }
      @keyframes yos-halo { to { opacity: 1; } }
      @keyframes yos-halo-drift { to { transform: translate(3vmax, -2vmax) scale(1.08); } }
      @keyframes yos-shimmer { to { transform: translateX(100%); } }

      /* Mouvement réduit : simple fondu, aucune animation en boucle */
      @media (prefers-reduced-motion: reduce) {
        .yos-loader *, .yos-loader::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        .yos-ring, .yos-sheen, .yos-chip { display: none; }
        .yos-fill::after { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Écran de chargement : l'application le referme via src/lib/splash.ts -->
    <div class="yos-loader" id="yos-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Chargement de YOS360">
      <div class="yos-stage">
        <div class="yos-mark-wrap">
          <span class="yos-chip c-tl" aria-hidden="true"><i></i>Ventes</span>
          <span class="yos-chip c-tr" aria-hidden="true"><i></i>Stock</span>
          <span class="yos-chip c-bl" aria-hidden="true"><i></i>Finance</span>
          <span class="yos-chip c-br" aria-hidden="true"><i></i>RH</span>
          <svg class="yos-mark" viewBox="440 420 1020 1110" aria-hidden="true">
            <defs>
              <clipPath id="yos-clip">
                <path d="M466 692L897 456C925 441 953 455 953 488L953 984L469 1259Z"/>
                <path d="M953 488C953 455 982 441 1010 457L1432 697L1432 1259L953 984Z"/>
                <path d="M469 1259L810 1066L953 1143L953 1450C953 1490 910 1515 873 1494Z"/>
                <path d="M953 1143L1091 1064L1432 1259L1031 1494C996 1515 953 1490 953 1450Z"/>
              </clipPath>
              <linearGradient id="yos-sheen-grad" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <filter id="yos-glow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="22"/>
              </filter>
            </defs>
            <g class="piece p-tl"><g class="breathe"><path fill="#48B068" d="M466 692L897 456C925 441 953 455 953 488L953 984L469 1259Z"/></g></g>
            <g class="piece p-tr"><g class="breathe"><path fill="#117A35" d="M953 488C953 455 982 441 1010 457L1432 697L1432 1259L953 984Z"/></g></g>
            <g class="piece p-bl"><g class="breathe"><path fill="#117A35" d="M469 1259L810 1066L953 1143L953 1450C953 1490 910 1515 873 1494Z"/></g></g>
            <g class="piece p-br"><g class="breathe"><path fill="#48B068" d="M953 1143L1091 1064L1432 1259L1031 1494C996 1515 953 1490 953 1450Z"/></g></g>
            <g clip-path="url(#yos-clip)"><g transform="skewX(-18)"><rect class="yos-sheen" x="440" y="420" width="380" height="1110" fill="url(#yos-sheen-grad)"/></g></g>
            <path class="yos-core" d="M953 1004L1060 1064L953 1124L842 1064Z" fill="#48B068" fill-opacity=".55" filter="url(#yos-glow)"/>
            <path class="yos-ring" d="M953 1004L1060 1064L953 1124L842 1064Z"/>
          </svg>
        </div>

        <div class="yos-word" aria-hidden="true">
          <div class="yos-title">
            <span class="b" style="animation-delay:calc(var(--t) + 1.10s)">Y</span><span class="b" style="animation-delay:calc(var(--t) + 1.16s)">O</span><span class="b" style="animation-delay:calc(var(--t) + 1.22s)">S</span><span class="g" style="animation-delay:calc(var(--t) + 1.34s)">3</span><span class="g" style="animation-delay:calc(var(--t) + 1.40s)">6</span><span class="g" style="animation-delay:calc(var(--t) + 1.46s)">0</span>
          </div>
        </div>

        <div class="yos-progress">
          <div class="yos-track"><div class="yos-fill" id="yos-fill"></div></div>
          <div class="yos-status"><span class="yos-msg" id="yos-msg">Connexion sécurisée…</span><span class="yos-pct" id="yos-pct">0 %</span></div>
        </div>
      </div>

      <footer class="yos-by" aria-hidden="true"><span>by</span> YOPOE</footer>
    </div>

    <script>
      // window.YOS360Splash.setProgress(0..1, message?) et .done() — appelés par src/lib/splash.ts.
      // La barre avance doucement d'elle-même entre deux étapes pour ne jamais sembler figée.
      window.YOS360Splash = (function () {
        var el = document.getElementById('yos-loader');
        var fill = document.getElementById('yos-fill');
        var msg = document.getElementById('yos-msg');
        var pct = document.getElementById('yos-pct');
        var STEPS = [
          [0,    'Connexion sécurisée…'],
          [0.25, 'Chargement des modules…'],
          [0.55, 'Synchronisation des données…'],
          [0.85, 'Préparation du tableau de bord…']
        ];
        var quick = document.documentElement.classList.contains('yos-splash-quick');
        var MIN_VISIBLE = quick ? 1500 : 3200; // laisse l'intro se jouer en entier
        var shownAt = performance.now();
        var target = 0, shown = 0, custom = null, current = msg.textContent, finished = false;

        function label(v) {
          if (custom) return custom;
          if (v >= 1) return 'Prêt';
          var text = STEPS[0][1];
          for (var i = 0; i < STEPS.length; i++) if (v >= STEPS[i][0]) text = STEPS[i][1];
          return text;
        }
        function render(v) {
          shown = v;
          fill.style.setProperty('--p', v);
          pct.textContent = Math.round(v * 100) + ' %';
          var text = label(v);
          if (text === current) return;
          current = text;
          msg.classList.add('is-swapping');
          setTimeout(function () { msg.textContent = current; msg.classList.remove('is-swapping'); }, 250);
        }
        var trickle = setInterval(function () {
          var ceiling = Math.min(0.92, target + 0.25);
          if (shown < ceiling) render(Math.max(target, shown + (ceiling - shown) * 0.05));
        }, 250);

        var api = {
          setProgress: function (p, message) {
            if (finished) return;
            target = Math.max(target, Math.min(1, Math.max(0, p)));
            if (message) custom = message;
            render(Math.max(shown, target));
          },
          done: function () {
            if (finished) return;
            custom = null;
            target = 1;
            render(1);
            finished = true;
            clearInterval(trickle);
            var wait = Math.max(0, MIN_VISIBLE - (performance.now() - shownAt)) + 350;
            setTimeout(function () {
              el.classList.add('is-done');
              el.setAttribute('aria-busy', 'false');
              setTimeout(function () { el.remove(); }, 1200);
            }, wait);
          }
        };
        // Filet de sécurité : l'écran ne reste jamais bloqué si l'application ne répond pas
        setTimeout(function () { api.done(); }, 20000);
        return api;
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
